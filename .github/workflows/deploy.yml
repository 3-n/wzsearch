# Builds the site from the committed inputs (offline – no crawl, no network) and deploys it to GitHub Pages: on every
# push to main that touches the site, the data or the pipeline, or by hand.
#
# Build outputs are not committed (docs/plans/all-districts.md §7 #4): `pipeline.city --offline` renders site/data,
# site/sources and the feeds of all 18 districts from data/ in about a minute. The district sites answer
# GitHub-hosted runners with 403 Forbidden (cloud IP ranges are blocked), so data is refreshed locally (`make city`)
# and pushed; this workflow then publishes it. The build must reproduce the committed build stamps (as test.yml
# checks) – a deploy never publishes data other than what the local refresh produced.

name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "data/**", "pipeline/**", "pyproject.toml", "uv.lock", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install poppler (pdftotext reads the districts' PDF lists, pipeline/pdftable.py)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site from the committed inputs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          uv run python -m pipeline.city --offline -q
          git diff --stat --exit-code -- data/build.json 'data/districts/*/build.json'

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
