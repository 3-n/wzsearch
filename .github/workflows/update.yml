# Scheduled data refresh + GitHub Pages deployment.
#
# 1. crawls the district's monthly pages and the BAiPP (city architecture bureau) lists and downloads
#    new/changed Excel files (polite, cached),
# 2. checks GUNB's RWDZ building-permit files with one conditional GET each (no secrets needed). The
#    ~93 MB of ZIPs are never committed (data/cache/rwdz/ is git-ignored): a 304 means the committed
#    Praga-Południe extracts (data/raw/rwdz/*.csv + data/cache/rwdz.json, tracked) are current; a new
#    snapshot is downloaded to the runner, filtered, and only a changed extract is committed,
# 3. parses, geocodes (from the git-tracked caches; only new lookups hit GUGiK) and exports,
# 4. runs the test suite against the fresh data,
# 5. commits changed data back to the repository (nothing is committed when nothing changed –
#    the build keeps `generated_at` when the data is identical),
# 6. deploys site/ to GitHub Pages.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# If the build fails (exit code 3: the district site is down, or GUNB changed its file format – the
# build then used the previous data), nothing is committed or deployed and the previously deployed
# site stays online; GitHub e-mails the repository owner about the failed run.

name: Update data & deploy

on:
  schedule:
    # The office publishes the previous month's lists around the 10th: check daily at 06:00 UTC
    # on the 9th–16th, and weekly (Mondays) the rest of the month.
    - cron: "0 6 9-16 * *"
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-download every source file (incl. the GUNB ZIPs, ~93 MB)"
        type: boolean
        default: false
      refresh_misses:
        description: "Retry cached geocoding misses now (normally after 30 days)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # a new GUNB snapshot: ~93 MB download + ~20 s filtering; first geocoding of a busy month: a few minutes
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build data (crawl, parse, geocode, export)
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
          REFRESH: ${{ inputs.refresh }}
          REFRESH_MISSES: ${{ inputs.refresh_misses }}
        run: |
          args=()
          if [ "$REFRESH" = "true" ]; then args+=(--refresh); fi
          if [ "$REFRESH_MISSES" = "true" ]; then args+=(--refresh-misses); fi
          uv run python -m pipeline.build "${args[@]}"

      - name: Test
        run: uv run pytest

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data site/data site/sources site/feed.xml
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
