# Tests for every push and pull request: the offline city build (must reproduce the committed build stamps),
# the Python pipeline (pytest, offline) and the frontend's pure modules (node --test, no dependencies).

name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install poppler (pdftotext reads the districts' PDF lists, pipeline/pdftable.py)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Offline rebuild reproduces the committed build stamps
        # Build outputs are not committed (plan §7 #4); every shard's build stamp (data/build.json,
        # data/districts/<slug>/build.json) holds the SHA-256 of its data documents. The build is deterministic
        # and its inputs are committed, so this Linux rebuild must reproduce the stamps made by the local refresh
        # (catches platform differences too, e.g. poppler's pdftotext). If it fails, run `make city-offline` and
        # commit the stamps – or find what makes the two platforms differ.
        # (`make` exports the public SITE_URL, so the committed reports render identically too)
        run: |
          make city-offline
          git diff --stat --exit-code -- data

      - name: A second rebuild changes nothing
        run: |
          make city-offline
          git diff --stat --exit-code -- data

      - name: pytest (incl. the checks on the real data built above)
        run: uv run pytest

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: node --test
        run: node --test 'tests/js/*.test.mjs'
