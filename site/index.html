  <script>
    /* Start the two data downloads now, in parallel with the CSS and the module graph; data.js takes each response
       once (a retry fetches again). Unlike <link rel=preload as=fetch> this keeps cache:'no-cache' (no stale data
       for minutes after a deploy) and is reused by every engine (WebKit downloaded preloaded files twice). */
    if (location.protocol !== 'file:' && window.fetch) {
      try {
        window.__wzEarly = {};
        ['data/records.json', 'data/sources.json'].forEach(function (u) {
          var p = fetch(u, { cache: 'no-cache' });
          p.catch(function () {}); /* handled by data.js; no "unhandled rejection" before it loads */
          window.__wzEarly[u] = p;
        });
      } catch (e) { window.__wzEarly = null; }
    }
  </script>

<body class="is-loading">
  <script>
    /* Native ES modules and fetch() do not work from file:// — explain how to start a local server. */
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        document.body.className = 'is-file';
        document.body.innerHTML =
          '<main class="page page--file"><div class="error-state">' +
          '<h1 class="page__title">Uruchom stronę przez serwer WWW</h1>' +
          '<p class="lead">Ta strona wczytuje dane z plików JSON, czego przeglądarki nie pozwalają robić dla plików otwartych bezpośrednio z dysku (<code>file://</code>).</p>' +
          '<p>W katalogu projektu uruchom jedno z poleceń, a potem otwórz <a href="http://localhost:8000/">http://localhost:8000/</a>:</p>' +
          '<pre><code>python3 -m http.server -d site 8000</code></pre>' +
          '<pre><code>npm run serve</code></pre>' +
          '<p class="muted small">Na GitHub Pages i każdym innym hostingu statycznym strona działa bez żadnej konfiguracji.</p>' +
          '</div></main>';
      });
    }
    /* A module that fails to load (flaky connection, a local server dropping a request) would leave the loading
       skeleton forever: show a message with a reload button instead (onerror of the main module script). */
    window.__wzBootFail = function () {
      if (document.body.classList.contains('has-error') || document.body.dataset.ready) return;
      document.body.classList.remove('is-loading');
      document.body.classList.add('has-error');
      var view = document.getElementById('view-explore');
      if (!view) return;
      view.hidden = false;
      view.innerHTML = '<div class="page page--error"><div class="error-state" role="alert">' +
        '<h1 class="page__title">Nie udało się wczytać strony</h1>' +
        '<p class="lead">Część plików strony nie dotarła – sprawdź połączenie i odśwież stronę.</p>' +
        '<div class="error-state__actions"><button type="button" class="btn btn--primary" onclick="location.reload()">Odśwież</button></div>' +
        '</div></div>';
    };
  </script>
